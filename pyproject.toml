[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charted-news-engine"
version = "1.0.0"
description = "Event-driven news-trading decision support system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "python-dateutil>=2.8",
    "APScheduler>=3.10",
    "streamlit>=1.32",
    "streamlit-autorefresh>=1.0",
    "psycopg[binary]>=3.2,<4",
    "google-auth>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
cne = "cne.cli.main:main"

[tool.setuptools.packages.find]
include = ["cne*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"